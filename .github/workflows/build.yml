name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Create google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON is empty - see README.md step 6"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          python3 -c "import json;d=json.load(open('app/google-services.json'));p=[c['client_info']['android_client_info']['package_name'] for c in d['client']];print('packages:',p);assert 'com.kitchensync.app' in p,'package name must be com.kitchensync.app'"
      - name: Download Nunito font (OFL licence; app falls back to system font if this fails)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fL "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf" -o app/src/main/assets/fonts/Nunito.ttf || true
          if [ ! -f app/src/main/assets/fonts/Nunito.ttf ] || [ "$(stat -c%s app/src/main/assets/fonts/Nunito.ttf)" -lt 100000 ]; then rm -f app/src/main/assets/fonts/Nunito.ttf; fi
      - name: Build debug + release APK
        shell: bash
        run: gradle assembleDebug assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|Could not" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenSync-apk
          path: app/build/outputs/apk/**/*.apk
